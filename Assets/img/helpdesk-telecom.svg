<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f4d82"/>
      <stop offset="1" stop-color="#2d1f7a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- fondo decorativo -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="2">
    <rect x="40" y="40" width="64" height="64" rx="14"/>
    <rect x="690" y="30" width="48" height="48" rx="11"/>
    <rect x="720" y="170" width="60" height="60" rx="14"/>
    <rect x="20" y="170" width="44" height="44" rx="10"/>
  </g>

  <!-- fibra óptica: hilos que llegan al router -->
  <g fill="none" stroke-linecap="round">
    <path d="M60 150 C140 150 170 110 250 110" stroke="#3ff2cf" stroke-width="3" stroke-opacity=".9"/>
    <path d="M60 165 C140 165 170 125 250 125" stroke="#5cc0ff" stroke-width="3" stroke-opacity=".9"/>
    <path d="M60 180 C140 180 170 140 250 140" stroke="#a58bff" stroke-width="3" stroke-opacity=".9"/>
  </g>
  <g fill="#ffffff">
    <circle cx="110" cy="150" r="3.500"/>
    <circle cx="150" cy="158" r="3.500"/>
    <circle cx="190" cy="128" r="3.500"/>
  </g>

  <!-- ONT / router -->
  <rect x="250" y="95" width="130" height="62" rx="12" fill="#ffffff" fill-opacity=".95"/>
  <rect x="266" y="112" width="10" height="10" rx="3" fill="#3ff2cf"/>
  <rect x="284" y="112" width="10" height="10" rx="3" fill="#5cc0ff"/>
  <rect x="302" y="112" width="10" height="10" rx="3" fill="#a58bff"/>
  <rect x="266" y="132" width="98" height="6" rx="3" fill="#2d1f7a" fill-opacity=".35"/>

  <!-- señal Wi-Fi sobre el router -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity=".9">
    <path d="M295 70 a30 30 0 0 1 40 0"/>
    <path d="M285 56 a46 46 0 0 1 60 0" stroke-opacity=".6"/>
  </g>
  <circle cx="315" cy="80" r="4" fill="#ffffff"/>

  <!-- onda hacia el teléfono -->
  <path d="M395 126 H500" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 11"/>

  <!-- teléfono móvil -->
  <rect x="520" y="60" width="74" height="128" rx="14" fill="#ffffff" fill-opacity=".95"/>
  <rect x="530" y="78" width="54" height="86" rx="6" fill="#2d1f7a"/>
  <rect x="548" y="68" width="18" height="4" rx="2" fill="#2d1f7a" fill-opacity=".4"/>
  <g fill="#3ff2cf">
    <rect x="538" y="140" width="6" height="12" rx="2"/>
    <rect x="548" y="132" width="6" height="20" rx="2"/>
    <rect x="558" y="124" width="6" height="28" rx="2"/>
    <rect x="568" y="116" width="6" height="36" rx="2"/>
  </g>

  <!-- auricular de soporte -->
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <path d="M630 130 a36 36 0 0 1 72 0"/>
  </g>
  <rect x="620" y="126" width="16" height="30" rx="7" fill="#ffffff"/>
  <rect x="696" y="126" width="16" height="30" rx="7" fill="#ffffff"/>
  <path d="M704 156 q0 18 -22 18" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="678" cy="174" r="5" fill="#3ff2cf"/>
</svg>
