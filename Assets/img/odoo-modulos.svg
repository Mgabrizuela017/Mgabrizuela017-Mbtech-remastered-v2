<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d1f7a"/>
      <stop offset="1" stop-color="#0f4d82"/>
    </linearGradient>
    <linearGradient id="dbOld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f6bff"/>
      <stop offset="1" stop-color="#5a3bd6"/>
    </linearGradient>
    <linearGradient id="dbNew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc0ff"/>
      <stop offset="1" stop-color="#2b8fd6"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>

  <!-- módulos decorativos de fondo -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="2">
    <rect x="110" y="50" width="76" height="76" rx="16"/>
    <rect x="250" y="140" width="52" height="52" rx="12"/>
    <rect x="390" y="40" width="44" height="44" rx="10"/>
    <rect x="1170" y="150" width="48" height="48" rx="12"/>
    <rect x="1310" y="40" width="84" height="84" rx="18"/>
    <rect x="1470" y="130" width="56" height="56" rx="13"/>
  </g>
  <g fill="#ffffff" fill-opacity=".05">
    <rect x="40" y="170" width="40" height="40" rx="10"/>
    <rect x="1230" y="60" width="36" height="36" rx="9"/>
  </g>

  <!-- base de datos origen -->
  <g>
    <path d="M580 70 v80 a60 18 0 0 0 120 0 v-80 z" fill="url(#dbOld)"/>
    <ellipse cx="640" cy="70" rx="60" ry="18" fill="#b7a2ff"/>
    <path d="M580 100 a60 18 0 0 0 120 0 M580 130 a60 18 0 0 0 120 0" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"/>
  </g>

  <!-- módulos en tránsito -->
  <rect x="752" y="36" width="34" height="34" rx="8" fill="#3ff2cf"/>
  <rect x="798" y="36" width="34" height="34" rx="8" fill="#5cc0ff"/>
  <rect x="844" y="36" width="34" height="34" rx="8" fill="#a58bff"/>

  <!-- flecha de migración -->
  <path d="M722 112 H870" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
  <path d="M868 98 L894 112 L868 126 z" fill="#ffffff" fill-opacity=".85"/>

  <!-- base de datos destino -->
  <g>
    <path d="M920 70 v80 a60 18 0 0 0 120 0 v-80 z" fill="url(#dbNew)"/>
    <ellipse cx="980" cy="70" rx="60" ry="18" fill="#a9e0ff"/>
    <path d="M920 100 a60 18 0 0 0 120 0 M920 130 a60 18 0 0 0 120 0" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="3"/>
  </g>
</svg>
